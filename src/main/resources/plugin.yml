name: TownyPorts
folia-supported: true
version: '${project.version}'
main: com.earthpol.townyports.PortsMain
api-version: '1.21'
depend: [ Towny ]
softdepend: [ Vault ]
authors: [ 0xBit , darthpeti, Bustun ]
description: TownyPorts is a plugin that allows you traverse the vast distance of the world through a system of ports designated all around the Minecraft world.
website: https://github.com/EarthPol
commands:
    port:
      aliases: []
      description: TownyPorts command for teleporting to ports
    townuuid:
      aliases: []
      description: Get a town's UUID
permissions:
  townyports.bypass.wilderness:
    description: Bypass the wilderness restriction when teleporting to a port.
    default: false
  townyports.bypass.distance:
    description: Bypass the maximum-distance restriction when teleporting to a port.
    default: false
  townyports.set.spawn:
    description: Allow setting a custom port spawn location (via /t set port spawn).
    default: false